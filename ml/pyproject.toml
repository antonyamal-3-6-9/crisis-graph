[project]
name = "crisisgraph-ml"
version = "0.1.0"
description = "Evaluation and model-development tooling for CrisisGraph"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
crisisgraph-triage-eval = "crisisgraph_ml.triage_eval:main"
crisisgraph-generate-triage-eval = "crisisgraph_ml.generate_triage_eval:main"
crisisgraph-validate-triage-data = "crisisgraph_ml.validate_triage_data:main"
crisisgraph-triage-sft-data = "crisisgraph_ml.triage_sft_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crisisgraph_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
