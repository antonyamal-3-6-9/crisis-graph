# Prometheus for a local CrisisGraph pipeline (M8). Run with ops/run-prometheus.sh.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: crisisgraph
    static_configs:
      - targets: ["localhost:3100"]
        labels: { role: api }
      - targets: ["localhost:9101"]
        labels: { role: triage }
      - targets: ["localhost:9102", "localhost:9112"]
        labels: { role: matcher }
      - targets: ["localhost:9103"]
        labels: { role: graph }
      - targets: ["localhost:9104"]
        labels: { role: relay }
      - targets: ["localhost:9105"]
        labels: { role: driver }

  # Extra triage workers for scaled-out runs (e.g. the M8 surge test). A
  # separate job, so RoleDown does not fire when only one worker runs.
  - job_name: crisisgraph-scaleout
    static_configs:
      - targets: ["localhost:9111", "localhost:9121", "localhost:9131"]
        labels: { role: triage }
